[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-business-analyst"
version = "1.0.0"
description = "LangGraph multi-agent business analyst"
requires-python = ">=3.12"
dependencies = ["pandas>=2.0", "numpy>=1.24", "openpyxl>=3.1", "matplotlib>=3.7", "scikit-learn>=1.2", "pypdf>=4.0", "reportlab>=4.0", "requests>=2.31", "pydantic>=2.0", "langgraph>=0.2", "langchain-core>=0.3", "langchain-groq>=0.2", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
run-analyst = "modular_app.cli:main"

[tool.setuptools.packages.find]
include = ["modular_app*"]

[tool.ruff]
line-length = 120
exclude = ["executed.ipynb", "kaggle_working_local"]

[tool.ruff.lint]
ignore = ["BLE001", "PYI034"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
